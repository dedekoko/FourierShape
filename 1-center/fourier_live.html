<meta charset="utf-8">
<title data-t="app.title"></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* التخطيط: لوحة رسم كبيرة بجانبها لوحة تحكّم بمعيار Fluent، وتنزل تحتها في الهاتف */
:root{
  --bg:#f3f3f3; --card:#ffffff; --card2:#f9f9fb; --line:#e0e0e6; --fg:#1b1b1f; --muted:#5f6170;
  --accent:#0067c0; --accent-fg:#ffffff; --accent-soft:#e6f0fa;
  --stage:#0d1512; --stage-ghost:#2e3a36; --trace:#ff6b5a; --circle:#8fb8a4; --arm:#d6ebe1; --pen:#ffffff; --fill:#c8473a;
  --cons-fixed:#c9d4cf; --cons-belt:#8fa8ff; --cons-arm:#a3b8b0;
  --tip:#c42b1c; --tip-fg:#ffffff;
  --ok:#0f7b0f; --warn:#9d5d00;
  --font:"Segoe UI Variable Text","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --r-ctl:4px; --r-win:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202020; --card:#2b2b2b; --card2:#323232; --line:#3d3d42; --fg:#f2f2f2; --muted:#b4b4bd;
  --accent:#4cc2ff; --accent-fg:#002a40; --accent-soft:#1f3442;
  --stage:#0a100e; --stage-ghost:#26322e;
  --tip:#d13438; --tip-fg:#ffffff; --ok:#6ccb5f; --warn:#fce100; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202020; --card:#2b2b2b; --card2:#323232; --line:#3d3d42; --fg:#f2f2f2; --muted:#b4b4bd;
  --accent:#4cc2ff; --accent-fg:#002a40; --accent-soft:#1f3442;
  --stage:#0a100e; --stage-ghost:#26322e;
  --tip:#d13438; --tip-fg:#ffffff; --ok:#6ccb5f; --warn:#fce100; color-scheme:dark}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:28px;line-height:36px;font-weight:600;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);flex-basis:100%}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-win);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.stage{padding:8px;background:var(--card2);display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage-bar .hint{color:var(--muted);font-size:12px;margin-inline-start:auto}
/* لوحة قابلة للسحب من زاويتها: يغيّر المستخدم عرضها وارتفاعها بحرّية */
.stage-box{resize:both;overflow:hidden;width:100%;height:640px;max-width:100%;min-width:200px;min-height:200px;
  border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--stage)}
.stage-box canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{display:flex;flex-direction:column}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h2{font-size:14px;line-height:20px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.02em}
.sec.alt{background:var(--card2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:var(--r-ctl);
  border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn:hover{background:var(--card2);border-color:var(--muted)}
.btn:active{background:var(--accent-soft);box-shadow:none}
.btn:disabled,.chip:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:active{filter:brightness(.9);background:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.btn svg{width:16px;height:16px;flex:none}
/* الأزرار بعرض نصّها وفي صفوف تلتفّ عند الضيق؛ والمترابطة منها داخل إطار واحد */
.group{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;max-width:100%;
  border:1px solid var(--line);border-radius:var(--r-win);background:var(--card)}
.group .check{padding-inline:6px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{display:flex;justify-content:space-between;gap:8px}
.field output{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:32px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--mono);min-width:0;min-height:32px;padding:4px 8px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip:hover{background:var(--card2);border-color:var(--muted)}
.chip:active{background:var(--accent-soft)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px}
.stat b{display:block;font-family:var(--mono);font-size:18px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;line-height:16px}
.drop{border:1px dashed var(--line);border-radius:var(--r-win);padding:4px 4px 4px 12px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.hint{margin-top:8px;font-size:12px;line-height:16px}
.msg{font-size:12px;line-height:16px;min-height:16px}
.msg.err{color:var(--tip)}
.msg.ok{color:var(--ok)}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.lower{grid-template-columns:minmax(0,1fr)}}
details.card>summary:hover{background:var(--card2);border-radius:var(--r-win)}
details.card>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r-win)}
details.card>summary{cursor:pointer;padding:12px 16px;min-height:32px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::before{content:"";width:8px;height:8px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open].card>summary::before{transform:rotate(-135deg)}
details.card .body{padding:0 16px 14px;line-height:1.75;max-width:70ch}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:14px;line-height:20px}
td.n{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:end;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px}
.tbl-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 16px 8px}
.tbl-top h2{margin:0;font-size:16px;font-weight:600}
.tbl-sum{color:var(--muted)}
.tbl-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 12px}
.tbl-scroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-ctl);margin:0 16px}
.tbl-scroll thead th{position:sticky;top:0;background:var(--card2);z-index:1;white-space:nowrap}
.tbl-scroll tr.new td,.tbl-scroll tr.changed td{background:var(--accent-soft)}
.pill{display:inline-block;padding:0 6px;border-radius:var(--r-ctl);background:var(--accent);color:var(--accent-fg);font-size:12px;line-height:18px;margin-inline-start:6px;font-family:var(--font)}
.pill.half{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tbl-note{padding:12px 16px 16px;margin:0;color:var(--muted);line-height:1.7;max-width:90ch}
code,.eq{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.eq{display:block;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px 10px;margin:8px 0;overflow-x:auto}
/* تلميح الفأرة بشكلنا الأحمر */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;inset-inline-start:0;top:calc(100% + 6px);z-index:20;
  background:var(--tip);color:var(--tip-fg);padding:5px 9px;border-radius:var(--r-ctl);font-size:12px;font-weight:400;white-space:normal;width:max-content;max-width:240px;
  box-shadow:0 4px 10px rgba(0,0,0,.2);pointer-events:none}
@media (prefers-reduced-motion: reduce){details.card>summary::before{transition:none}}
</style>

<div class="wrap" dir="rtl">
  <header>
    <span data-icon="logo"></span>
    <h1 data-t="app.title"></h1>
    <p data-t="app.intro"></p>
  </header>

  <div class="layout">
    <div class="card stage">
      <div class="stage-bar">
        <div class="group">
          <button class="btn" id="fitBtn" data-t-tip="stage.fit_tip"><span data-icon="fit"></span><span data-t="stage.fit"></span></button>
          <button class="btn" id="fullBtn" data-t-tip="stage.full_tip"><span data-icon="full"></span><span data-t="stage.full"></span></button>
          <label class="check"><input type="checkbox" id="autoFit" checked> <span data-t="stage.auto"></span></label>
        </div>
        <span class="hint" data-t="stage.hint"></span>
      </div>
      <div class="stage-box" id="stageBox"><canvas id="cv" data-t-aria="canvas.aria"></canvas></div>
    </div>

    <div class="card panel">
      <div class="sec">
        <h2 data-t="shapes.title"></h2>
        <div class="toolbar"><div class="group" id="shapes"></div></div>
        <div class="drop toolbar" id="drop">
          <button class="btn" id="uploadBtn" data-t-tip="upload.tip">
            <span data-icon="upload"></span>
            <span data-t="upload.button"></span>
          </button>
          <span class="hint" data-t="upload.drop_hint"></span>
          <input type="file" id="file" accept="image/*" hidden>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </div>

      <div class="sec alt">
        <h2 data-t="playback.title"></h2>
        <div class="toolbar">
          <div class="group">
            <button class="btn primary" id="play" data-t-tip="playback.play_tip"></button>
            <button class="btn" id="restart" data-t-tip="playback.restart_tip">
              <span data-icon="restart"></span>
              <span data-t="playback.restart"></span>
            </button>
          </div>
          <div class="group">
            <button class="btn" id="modeStages" aria-pressed="true" data-t-tip="mode.stages_tip" data-t="mode.stages"></button>
            <button class="btn" id="modeManual" aria-pressed="false" data-t-tip="mode.manual_tip" data-t="mode.manual"></button>
          </div>
        </div>
        <div class="toolbar"><div class="chips group" id="chips" data-t-aria="chips.aria"></div></div>
        <div class="field">
          <label for="n"><span data-t="count.label"></span> <output id="nOut">1</output></label>
          <input type="range" id="n" min="1" max="300" value="1">
        </div>
        <div class="field">
          <label for="speed"><span data-t="speed.label"></span> <output id="speedOut">1×</output></label>
          <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1">
        </div>
        <div class="field" data-t-tip="points.tip">
          <label for="pts"><span data-t="points.label"></span> <output id="ptsOut">600</output></label>
          <input type="range" id="pts" min="8" max="1000" step="1" value="600">
          <span class="hint" id="ptsHint"></span>
        </div>
        <div class="toolbar"><div class="group">
          <label class="check"><input type="checkbox" id="showCircles" checked> <span data-t="show.circles"></span></label>
          <label class="check"><input type="checkbox" id="showGhost" checked> <span data-t="show.ghost"></span></label>
          <label class="check"><input type="checkbox" id="showPoints" checked> <span data-t="show.points"></span></label>
          <label class="check" data-t-tip="show.constraints_tip"><input type="checkbox" id="showCons"> <span data-t="show.constraints"></span></label>
        </div></div>
      </div>

      <div class="sec">
        <h2 data-t="stats.title"></h2>
        <div class="stats">
          <div class="stat" data-t-tip="stats.count_tip"><b id="sN">1</b><span data-t="stats.count_label"></span></div>
          <div class="stat" data-t-tip="stats.error_tip"><b id="sErr">–</b><span data-t="stats.error_label"></span></div>
          <div class="stat" data-t-tip="stats.points_tip"><b id="sPts">–</b><span data-t="stats.points_label"></span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="stack">
    <section class="card tblcard">
      <div class="tbl-top">
        <h2 data-t="table.title"></h2>
        <span class="tbl-sum" id="tblSum" role="status"></span>
      </div>
      <div class="tbl-head">
        <div class="tabs group">
          <button class="btn" id="tabC" aria-pressed="true" data-t="tab.complex" data-t-tip="tab.complex_tip"></button>
          <button class="btn" id="tabA" aria-pressed="false" data-t="tab.abcd" data-t-tip="tab.abcd_tip"></button>
        </div>
        <button class="btn" id="copyTbl" data-t-tip="table.copy_tip"><span data-icon="copy"></span><span data-t="table.copy"></span></button>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead id="thd"></thead>
          <tbody id="tbl"></tbody>
        </table>
      </div>
      <p class="tbl-note" id="tblNote"></p>
    </section>
    <details class="card">
      <summary data-t="how.title"></summary>
      <div class="body">
        <p data-t="how.step1"></p>
        <p data-t="how.step2"></p>
        <p data-t="how.step3"></p>
        <span class="eq">c_k = (1/N) · Σ z_j · e^(−2πi·k·j/N)      z_j = x_j + i·y_j</span>
        <p data-t="how.step4"></p>
        <span class="eq">z(t) = c_0 + Σ c_k · e^(i·k·t)</span>
        <p data-t="how.step5"></p>
      </div>
    </details>
  </div>
</div>

<script>
/* سجلّ الأيقونات: كل أيقونة معرّفة هنا مرة واحدة بلونها (الصفحة مستقلة فلا ملف أيقونات خارجي).
   {vb: viewBox، attrs: سمات إضافية على svg، body: المحتوى}. في "shape" الرمز {c} يُستبدل بلون الشكل. */
const ICONS = {
  fit: {vb:"0 0 16 16", body:'<path d="M2 5.5V2h3.5M14 5.5V2h-3.5M2 10.5V14h3.5M14 10.5V14h-3.5" fill="none" stroke="#0078d4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="5.5" y="4.5" width="5" height="7" rx="1" fill="#2fa36b"/>'},
  full: {vb:"0 0 16 16", body:'<path d="M1.5 8h13" stroke="#8a5cd6" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 5 1.5 8l3 3M11.5 5l3 3-3 3" fill="none" stroke="#e8a317" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'},
  copy: {vb:"0 0 16 16", body:'<rect x="5.5" y="5.5" width="8" height="8.5" rx="1.2" fill="none" stroke="#0078d4" stroke-width="1.5"/><path d="M10.5 3.5V3a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1v7.5a1 1 0 0 0 1 1h.5" fill="none" stroke="#8a5cd6" stroke-width="1.5" stroke-linecap="round"/>'},
  logo: {vb:"0 0 34 34", attrs:'width="34" height="34" aria-hidden="true"', body:'<circle cx="13" cy="17" r="10" fill="none" stroke="#2fa36b" stroke-width="2"/><circle cx="21" cy="12" r="5" fill="none" stroke="#e8a317" stroke-width="2"/><line x1="13" y1="17" x2="21" y2="12" stroke="#0067c0" stroke-width="2"/><circle cx="24.5" cy="8.5" r="2.5" fill="#e0453a"/>'},
  pause: {vb:"0 0 16 16", body:'<rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="#ffb900"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="#ff8c00"/>'},
  play: {vb:"0 0 16 16", body:'<path d="M4 2.5v11l9-5.5z" fill="#6ccb5f"/>'},
  restart: {vb:"0 0 16 16", body:'<path d="M3 8a5 5 0 1 0 1.6-3.7" fill="none" stroke="#8a5cd6" stroke-width="1.6" stroke-linecap="round"/><path d="M3 2.5v3h3" fill="none" stroke="#e8a317" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'},
  shape: {vb:"0 0 16 16", body:'<circle cx="8" cy="8" r="6" fill="none" stroke="{c}" stroke-width="1.8"/><circle cx="8" cy="8" r="2" fill="{c}"/>'},
  upload: {vb:"0 0 16 16", body:'<path d="M8 11V2M4.5 5.5 8 2l3.5 3.5" fill="none" stroke="#0078d4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 10v3.2c0 .4.4.8.8.8h10.4c.4 0 .8-.4.8-.8V10" fill="none" stroke="#2fa36b" stroke-width="1.6" stroke-linecap="round"/>'}
};
/* تعيد نص svg للأيقونة name؛ color اختياري يملأ {c} (لأيقونة الأشكال). اسم مجهول: مربّع بعلامة استفهام مع تحذير. */
function icon(name, color){
  const d = ICONS[name];
  if(!d){
    console.warn("أيقونة غير معرّفة:", name);
    return '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="#e8a317" stroke-width="1.4"/><text x="8" y="12" font-size="10" text-anchor="middle" fill="#e8a317">?</text></svg>';
  }
  return `<svg viewBox="${d.vb}"${d.attrs?" "+d.attrs:""}>${d.body.replace(/\{c\}/g, color||"#888")}</svg>`;
}
/* تستبدل كل عنصر [data-icon] في الصفحة بأيقونته. */
function applyIcons(){
  document.querySelectorAll("[data-icon]").forEach(el => el.outerHTML = icon(el.dataset.icon));
}
/* كل النصوص الظاهرة للمستخدم في مكان واحد (الصفحة مستقلة فلا ملف نصوص خارجي). للترجمة: بدّل قيم هذا الكائن. */
const STRINGS = {
  "app.intro": "اختر شكلًا أو ارفع صورة، ثم شاهد الدوائر الدوّارة ترسم محيطه. كل دائرة حدّ من سلسلة فورييه، وكلما زاد عددها اقترب الرسم من الأصل.",
  "app.title": "راسم فورييه للأشكال",
  "canvas.aria": "لوحة الرسم بالدوائر الدوّارة",
  "chips.aria": "مراحل عدد الدوائر",
  "count.label": "عدد الدوائر",
  "how.step1": "1. يُستخرج محيط الشكل من الصورة: يُفصل الشكل عن الخلفية، ويؤخذ أكبر جزء متّصل، ثم يُتتبّع حدّه نقطةً نقطة.",
  "how.step2": "2. تُوزَّع على المحيط نقاط متساوية التباعد. هذا يثبّت سرعة المرور، فلا تتغيّر المعاملات إلا بتغيّر الشكل.",
  "how.step3": "3. تُعامل كل نقطة عددًا مركّبًا، ويُحسب تحويل فورييه المتقطّع لها:",
  "how.step4": "4. كل معامل دائرة: حجمه نصف قطرها، وتردّده سرعة دورانها واتجاهه، وزاويته موضع بدايتها. تُرتَّب الدوائر من الأكبر إلى الأصغر، ويُرسم الشكل بمجموع أوّل n منها:",
  "how.step5": "فصلُ هذه الصيغة إلى جزأيها الحقيقي والتخيّلي يعطي معادلتي x(t) وy(t) اللتين تظهران في الفيديو.",
  "how.title": "كيف يعمل البرنامج",

/** يعيد نص المفتاح مع تعويض {name} من params؛ إن غاب المفتاح يعيده نفسه ويحذّر في الكونسول. */
function t(key, params){
  let v = STRINGS[key];
  if(v === undefined){ console.warn("missing string:", key); return key; }
  if(params) v = v.replace(/\{(\w+)\}/g, (m, p) => (p in params ? params[p] : m));
  return v;
}

/** يملأ عناصر HTML الثابتة: data-t للنص، data-t-tip للتلميح، data-t-aria لـ aria-label. */
function applyStrings(){
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-tip]").forEach(el => el.setAttribute("data-tip", t(el.dataset.tTip)));
  document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.tAria)));
}

  for(let i=1;i<=pts.length;i++){const a=pts[i-1],b=pts[i%pts.length];L.push(L[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  const total=L[L.length-1], out=[]; let j=0;
  for(let i=0;i<n;i++){
    const s=total*i/n; while(L[j+1]<s) j++;
    const a=pts[j], b=pts[(j+1)%pts.length], f=(s-L[j])/((L[j+1]-L[j])||1);
    out.push([a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]);
  }
  return out;
}

/** تحويل فورييه المتقطّع: يرجع المركز والدوائر مرتّبة تنازليًّا بنصف القطر. */
function dft(pts){
  const N=pts.length, terms=[]; let c0=null;
  for(let k=0;k<N;k++){
    let re=0,im=0;
    for(let j=0;j<N;j++){
      const a=-2*Math.PI*k*j/N, c=Math.cos(a), s=Math.sin(a), x=pts[j][0], y=pts[j][1];
      re+=x*c-y*s; im+=x*s+y*c;
    }
    re/=N; im/=N;
    const f = k<=N/2 ? k : k-N;   // التردّدات السالبة: دوران عكسي
    if(f===0) c0={re,im}; else terms.push({k:f,re,im,r:Math.hypot(re,im)});
  }
  terms.sort((a,b)=>b.r-a.r);
  return {c0,terms};
}

/** نقطة الرسم عند الزمن tau بأوّل n دائرة. */
function evalAt(tau,n){
  let x=S.c0.re,y=S.c0.im;
  for(let i=0;i<n;i++){const T=S.terms[i],a=T.k*tau,c=Math.cos(a),s=Math.sin(a);x+=T.re*c-T.im*s;y+=T.re*s+T.im*c;}
  return [x,y];
}

/** يجهّز الأثر الكامل لعدد الدوائر الحالي ويحسب الانحراف عن الأصل. */
function rebuild(){
  const M=900, tr=[];
  for(let i=0;i<=M;i++) tr.push(evalAt(2*Math.PI*i/M,S.n));
  S.trail=tr;
  // لماذا نقيس على المحيط الأصلي الكثيف لا على النقاط المأخوذة: بنقاط قليلة يمرّ الرسم
  // بالنقاط تمامًا لكنه ينحرف بينها، والمهمّ مطابقة الشكل الحقيقي.
  // المحيطان يبدآن من النقطة نفسها ومتساويا التباعد، فالنقطة j تقابل الزمن 2πj/N.
  const R=S.raw, N=R.length; let sum=0;
  for(let j=0;j<N;j++){const p=evalAt(2*Math.PI*j/N,S.n);sum+=Math.hypot(p[0]-R[j][0],p[1]-R[j][1]);}
  const b=S.box, diag=Math.hypot(b.w,b.h);
  S.err=sum/N/diag*100;
  $("sN").textContent=S.n; $("nOut").textContent=S.n; $("n").value=S.n;
  $("sErr").textContent=S.err<10?S.err.toFixed(2)+"%":S.err.toFixed(1)+"%";
  document.querySelectorAll(".chip").forEach(c=>{
    c.classList.toggle("on",S.mode==="stages"&&+c.dataset.n===S.n);
    c.disabled=+c.dataset.n>S.terms.length;
  });
  renderTables();
}

/** يحمّل شكلًا جديدًا (محيطه الأصلي الكثيف) ويبدأ الرسم من أوّل مرحلة. */
function loadPoints(raw){
  S.raw=raw;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of raw){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  S.box={x:x0,y:y0,w:x1-x0,h:y1-y0};
  S.tableN=0; S.lastAbcd=null; S.prevTableN=0; S.prevAbcd=null;   // شكل جديد: لا مقارنة مع جدول الشكل السابق
  sample(); restart();
  if($("autoFit").checked) fitStage();
}

/** يأخذ من المحيط الأصلي S.P نقطة متساوية التباعد ويعيد حساب الدوائر، دون إعادة المراحل. */
function sample(){
  S.pts=resample(S.raw,S.P);
  const r=dft(S.pts); S.c0=r.c0; S.terms=r.terms;
  const max=S.terms.length;
  $("n").max=Math.min(300,max); if(S.n>max) S.n=max;
  $("sPts").textContent=S.P; $("ptsOut").textContent=S.P;
  $("ptsHint").textContent=t("points.hint",{max});
}

/** يعيد بناء الحدود بصيغة الفيديو من أوّل n دائرة: لكل |k| يجمع الدائرتين +k و−k (إن وُجدتا). */
function abcdRows(){
  const m=new Map();
  for(let i=0;i<S.n;i++){const T=S.terms[i],h=Math.abs(T.k);if(!m.has(h))m.set(h,{p:null,q:null});const e=m.get(h);if(T.k>0)e.p=T;else e.q=T;}
  // لماذا هذه الصيغ: c·e^(int) + d·e^(−int) مفكوكة إلى جزأيها الحقيقي (x) والتخيّلي (y)
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([h,e])=>{
    const pr=e.p?e.p.re:0,pi=e.p?e.p.im:0,qr=e.q?e.q.re:0,qi=e.q?e.q.im:0;
    return {h,a:pr+qr,b:qi-pi,c:pi+qi,d:pr-qr,full:!!(e.p&&e.q)};
  });
}
const f2=v=>v.toFixed(2);
const sgn=k=>(k>0?"+":"")+k;

/** يرسم جدول الدوائر المستعملة الآن، ويلوّن ما أُضيف أو تغيّر منذ آخر خطوة. */
function renderTables(sameStep){
  // sameStep: تبديل تبويب فقط، فيُقارن بالخطوة السابقة نفسها ولا تُحفظ خطوة جديدة
  const prev=sameStep?(S.prevTableN||0):(S.tableN||0), last=sameStep?S.prevAbcd:S.lastAbcd;
  const added=Math.max(0,S.n-prev);
  $("tblSum").textContent=t("table.summary",{n:S.n,m:added});
  const abcd=abcdRows(), now=new Map();
  abcd.forEach(r=>now.set(r.h,[r.a,r.b,r.c,r.d].map(f2).join("|")+(r.full?"F":"H")));
  if(S.tab==="c"){
    $("thd").innerHTML=`<tr><th>${t("table.rank")}</th><th>${t("table.freq")}</th><th>${t("table.radius")}</th><th>${t("table.angle")}</th><th>${t("table.re")}</th><th>${t("table.im")}</th></tr>`;
    let h="";
    for(let i=0;i<S.n;i++){
      const T=S.terms[i], isNew=prev>0&&i>=prev, ang=Math.atan2(T.im,T.re)*180/Math.PI;
      h+=`<tr class="${isNew?"new":""}"><td class="n">${i+1}${isNew?`<span class="pill">${t("table.new")}</span>`:""}</td><td class="n">${sgn(T.k)}</td><td class="n">${f2(T.r)}</td><td class="n">${ang.toFixed(1)}°</td><td class="n">${f2(T.re)}</td><td class="n">${f2(T.im)}</td></tr>`;
    }
    $("tbl").innerHTML=h; $("tblNote").textContent=t("table.note");
  }else{
    $("thd").innerHTML=`<tr><th>${t("abcd.n")}</th><th>a</th><th>b</th><th>c</th><th>d</th><th>${t("abcd.state")}</th></tr>`;
    let h=`<tr><td>${t("abcd.center")}</td><td class="n">${f2(S.c0.re)}</td><td class="n">—</td><td class="n">${f2(S.c0.im)}</td><td class="n">—</td><td></td></tr>`;
    for(const r of abcd){
      const key=now.get(r.h), was=last&&last.get(r.h);
      const status=!last||!prev?"":!was?"new":was!==key?"changed":"";
      const pill=status==="new"?`<span class="pill">${t("abcd.new")}</span>`:status==="changed"?`<span class="pill">${t("abcd.changed")}</span>`:"";
      h+=`<tr class="${status}"><td class="n">${r.h}${pill}</td><td class="n">${f2(r.a)}</td><td class="n">${f2(r.b)}</td><td class="n">${f2(r.c)}</td><td class="n">${f2(r.d)}</td><td><span class="pill ${r.full?"":"half"}">${t(r.full?"abcd.full":"abcd.half")}</span></td></tr>`;
    }
    $("tbl").innerHTML=h; $("tblNote").textContent=t("abcd.note");
  }
  // يُحفظ مع كل خطوة (أيًّا كان التبويب) حتى يُقارن التغيير بالخطوة السابقة فعلًا
  if(!sameStep){ S.prevTableN=prev; S.prevAbcd=last; S.tableN=S.n; S.lastAbcd=now; }
}

/** ينسخ الجدول الظاهر نصًّا مفصولًا بعلامات جدولة، للصق في Excel. */
function copyTable(){
  const rows=[...document.querySelectorAll(".tbl-scroll tr")].map(tr=>[...tr.children].map(td=>{
    const c=td.cloneNode(true); c.querySelectorAll(".pill").forEach(p=>{ if(!td.closest("tbody")||td!==tr.lastElementChild) p.remove(); });
    return c.textContent.trim();
  }).join("\t")).join("\n");
  const done=()=>setMsg(t("table.copied"),"ok"), fail=()=>setMsg(t("table.copy_fail"),"err");
  try{ navigator.clipboard.writeText(rows).then(done,fail); }catch(e){ fail(); }
}

function restart(){
  S.stage=0; S.t=0; S.hold=0;
  if(S.mode==="stages") S.n=Math.min(STAGES[0],S.terms.length);
  rebuild();
}

/* ---------- استخراج المحيط من صورة مرفوعة ---------- */

/** يستخرج محيط أكبر شكل في صورة: قناع أمامي، أكبر جزء متّصل، ثم تتبّع الحدّ (Moore). */
function contourFromImage(img){
  const MAX=420, sc=Math.min(1,MAX/Math.max(img.width,img.height));
  const W=Math.max(8,Math.round(img.width*sc))+2, H=Math.max(8,Math.round(img.height*sc))+2;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d"); g.drawImage(img,1,1,W-2,H-2);
  const d=g.getImageData(0,0,W,H).data, n=W*H;
  // هل في الصورة شفافية حقيقية؟ إن كانت فهي أدقّ فاصل بين الشكل والخلفية
  let minA=255,maxA=0; for(let i=1*W+1;i<n-W-1;i++){const a=d[i*4+3];if(a<minA)minA=a;if(a>maxA)maxA=a;}
  const fg=new Uint8Array(n);
  if(minA<128&&maxA>128){
    for(let i=0;i<n;i++) fg[i]=d[i*4+3]>128?1:0;
  }else{
    const gray=new Uint8Array(n), hist=new Array(256).fill(0);
    for(let i=0;i<n;i++){const a=d[i*4+3]/255, v=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])*a+255*(1-a);gray[i]=v;hist[gray[i]]++;}
    // عتبة Otsu
    let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
    let sB=0,wB=0,best=0,th=127;
    for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>best){best=v;th=i;}}
    // الخلفية هي اللون الغالب على حوافّ الصورة
    let bright=0,cnt=0;
    for(let x=1;x<W-1;x++){bright+=gray[W+x]>th;bright+=gray[(H-2)*W+x]>th;cnt+=2;}
    for(let y=1;y<H-1;y++){bright+=gray[y*W+1]>th;bright+=gray[y*W+W-2]>th;cnt+=2;}
    const bgBright=bright/cnt>0.5;
    for(let i=0;i<n;i++) fg[i]=(gray[i]>th)!==bgBright?1:0;
  }
  for(let x=0;x<W;x++){fg[x]=0;fg[(H-1)*W+x]=0;} for(let y=0;y<H;y++){fg[y*W]=0;fg[y*W+W-1]=0;}
  // أكبر جزء متّصل
  const lab=new Int32Array(n); let bestL=0,bestSize=0,L=0; const st=[];
  for(let i=0;i<n;i++){ if(!fg[i]||lab[i]) continue; L++; let size=0; st.push(i); lab[i]=L;
    while(st.length){const p=st.pop();size++;for(const q of [p-1,p+1,p-W,p+W]) if(fg[q]&&!lab[q]){lab[q]=L;st.push(q);}}
    if(size>bestSize){bestSize=size;bestL=L;} }
  if(bestSize<50) return null;
  const inside=i=>lab[i]===bestL;
  // تتبّع الحدّ بطريقة Moore، بدءًا من أعلى نقطة يسرى
  let s=0; while(!inside(s)) s++;
  const DX=[1,1,0,-1,-1,-1,0,1], DY=[0,1,1,1,0,-1,-1,-1];
  const dirOf=(dx,dy)=>{for(let k=0;k<8;k++) if(DX[k]===dx&&DY[k]===dy) return k; return 4;};
  const out=[]; let p=s, b=4, guard=0;
  do{
    out.push([p%W,Math.floor(p/W)]);
    let found=false;
    for(let i=1;i<=8;i++){
      const dd=(b+i)%8, q=p+DX[dd]+DY[dd]*W;
      if(inside(q)){ const pd=(dd+7)%8, prev=p+DX[pd]+DY[pd]*W;
        b=dirOf((prev%W)-(q%W), Math.floor(prev/W)-Math.floor(q/W)); p=q; found=true; break; }
    }
    if(!found) break;
  }while(p!==s && ++guard<200000);
  return out.length>20?out:null;
}

function loadImageFile(file){
  if(!file||!file.type.startsWith("image/")){setMsg(t("msg.not_image"),"err");return;}
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    const c=contourFromImage(img); URL.revokeObjectURL(url);
    if(!c){setMsg(t("msg.no_shape"),"err");return;}
    S.custom=resample(c,RAW_POINTS); S.customName=file.name; selectShape("upload");
    setMsg(t("msg.extracted",{name:file.name}),"ok");
  };
  img.onerror=()=>{setMsg(t("msg.read_failed"),"err");URL.revokeObjectURL(url);};
  img.src=url;
}
function setMsg(t,kind){const m=$("msg");m.textContent=t;m.className="msg "+(kind||"");}

/* ---------- الرسم ---------- */

function tok(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

/** يضبط حجم اللوحة على نسبة الشكل: يبدأ من العرض المتاح، ولا يتجاوز الارتفاعُ 82% من الشاشة. */
function fitStage(){
  const box=$("stageBox"), avail=box.parentElement.clientWidth-16, ratio=S.box.h/S.box.w;
  let w=avail, h=w*ratio;
  const maxH=Math.max(240,window.innerHeight*0.82);
  if(h>maxH){h=maxH; w=h/ratio;}
  w=Math.max(200,Math.min(avail,w)); h=Math.max(200,h);
  box.style.width=Math.round(w)+"px"; box.style.height=Math.round(h)+"px";
}
/** يعيد اللوحة إلى كامل العرض مع إبقاء ارتفاعها. */
function fullStage(){$("stageBox").style.width="100%";}

function fit(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  const b=S.box, s=Math.min(w*0.6/b.w, h*0.6/b.h);
  return {w,h,s,ox:w/2-(b.x+b.w/2)*s, oy:h*0.47-(b.y+b.h/2)*s, dpr};
}

/** يرسم القيود الميكانيكية لسلسلة دوائر (مواضع مفاصلها بالبكسل في joints):
 *  مسنّن ثابت في المركز مثبّت في الإطار، ولكل ذراع قضيب بطول ثابت، وبكرة عند طرفه،
 *  وسير يلفّ بكرتها وبكرة المفصل الذي قبلها؛ هذا السير هو ما يفرض سرعة الدائرة واتجاهها.
 *  لا يُرسم إلا أوّل maxArms ذراعًا، والأذرع الأقصر من 4 بكسلات تُترك لأنها لا تُرى. */
function drawConstraints(joints,dpr,col,maxArms){
  const n=Math.min(joints.length-1,maxArms||12);
  const teeth=(x,y,R,ang)=>{ctx.beginPath();ctx.arc(x,y,R,0,2*Math.PI);ctx.stroke();
    const k=Math.max(8,Math.round(R/(2.2*dpr)));ctx.beginPath();
    for(let i=0;i<k;i++){const a=ang+i*2*Math.PI/k;ctx.moveTo(x+R*Math.cos(a),y+R*Math.sin(a));ctx.lineTo(x+(R+3*dpr)*Math.cos(a),y+(R+3*dpr)*Math.sin(a));}
    ctx.stroke();};
  const [cx,cy]=joints[0],RS=11*dpr;
  // الإطار الثابت: قاعدة مخطّطة يُثبَّت فيها المسنّن الشمس فلا يدور
  ctx.strokeStyle=col.fixed;ctx.lineWidth=1.2*dpr;ctx.globalAlpha=.9;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+RS*1.7);ctx.moveTo(cx-RS*1.6,cy+RS*1.7);ctx.lineTo(cx+RS*1.6,cy+RS*1.7);ctx.stroke();
  ctx.beginPath();for(let i=-3;i<=3;i++){ctx.moveTo(cx+i*RS*.5,cy+RS*1.7);ctx.lineTo(cx+i*RS*.5-RS*.4,cy+RS*2.2);}ctx.stroke();
  teeth(cx,cy,RS,0);
  for(let i=0;i<n;i++){
    const [ax,ay]=joints[i],[bx,by]=joints[i+1],L=Math.hypot(bx-ax,by-ay);if(L<4*dpr)continue;
    const ux=(bx-ax)/L,uy=(by-ay)/L,nx=-uy,ny=ux,ang=Math.atan2(uy,ux);
    const rB=Math.max(3*dpr,Math.min(8*dpr,L*.14)),rA=i===0?RS:Math.max(3*dpr,Math.min(8*dpr,L*.14));
    ctx.globalAlpha=.35;ctx.strokeStyle=col.armbar;ctx.lineWidth=6*dpr;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    ctx.globalAlpha=.85;ctx.strokeStyle=col.belt;ctx.lineWidth=1.2*dpr;ctx.lineCap="butt";
    ctx.beginPath();ctx.moveTo(ax+nx*rA,ay+ny*rA);ctx.lineTo(bx+nx*rB,by+ny*rB);ctx.moveTo(ax-nx*rA,ay-ny*rA);ctx.lineTo(bx-nx*rB,by-ny*rB);ctx.stroke();
    ctx.strokeStyle=col.fixed;ctx.globalAlpha=.9;teeth(bx,by,rB,ang*3);
    ctx.fillStyle=col.fixed;ctx.beginPath();ctx.arc(bx,by,1.8*dpr,0,2*Math.PI);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.lineCap="butt";
}

function draw(){
  const F=fit(), {w,h,s,ox,oy,dpr}=F, P=p=>[p[0]*s+ox,p[1]*s+oy];
  const col={stage:tok("--stage"),ghost:tok("--stage-ghost"),trace:tok("--trace"),circle:tok("--circle"),arm:tok("--arm"),pen:tok("--pen"),fill:tok("--fill")};
  ctx.fillStyle=col.stage; ctx.fillRect(0,0,w,h);
  const path=(pts,close)=>{ctx.beginPath();pts.forEach((p,i)=>{const q=P(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});if(close)ctx.closePath();};
  if($("showGhost").checked){path(S.raw,true);ctx.fillStyle=col.ghost;ctx.fill();}
  if($("showPoints").checked){
    // النقاط المأخوذة: كل نقطة منها مدخل في تحويل فورييه
    const rad=(S.P>300?1.6:S.P>80?2.4:3.6)*dpr;
    ctx.fillStyle=col.arm; ctx.globalAlpha=.75;
    for(const p of S.pts){const q=P(p);ctx.beginPath();ctx.arc(q[0],q[1],rad,0,2*Math.PI);ctx.fill();}
    ctx.globalAlpha=1;
  }
  if(S.hold>0){
    path(S.trail,true); ctx.globalAlpha=.85; ctx.fillStyle=col.fill; ctx.fill(); ctx.globalAlpha=1;
    ctx.lineWidth=3*dpr; ctx.strokeStyle=col.trace; ctx.stroke();
  }else{
    const upto=Math.max(2,Math.floor(S.t*(S.trail.length-1))+1);
    path(S.trail.slice(0,upto),false); ctx.lineWidth=3*dpr; ctx.lineJoin="round"; ctx.strokeStyle=col.trace; ctx.stroke();
    // سلسلة الدوائر
    const tau=2*Math.PI*S.t; let x=S.c0.re,y=S.c0.im;
    const show=$("showCircles").checked, joints=[P([x,y])];
    for(let i=0;i<S.n;i++){
      const T=S.terms[i], a=T.k*tau, nx=x+T.re*Math.cos(a)-T.im*Math.sin(a), ny=y+T.re*Math.sin(a)+T.im*Math.cos(a);
      const [px,py]=P([x,y]), [qx,qy]=P([nx,ny]), rr=T.r*s;
      if(show){
        if(rr>1.5){ctx.beginPath();ctx.arc(px,py,rr,0,2*Math.PI);ctx.strokeStyle=col.circle;ctx.globalAlpha=Math.max(.25,.8-i*.01);ctx.lineWidth=1*dpr;ctx.stroke();}
        ctx.globalAlpha=.9;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(qx,qy);ctx.strokeStyle=col.arm;ctx.lineWidth=1.2*dpr;ctx.stroke();ctx.globalAlpha=1;
      }
      x=nx;y=ny; joints.push([qx,qy]);
    }
    if($("showCons").checked) drawConstraints(joints,dpr,{fixed:tok("--cons-fixed"),belt:tok("--cons-belt"),armbar:tok("--cons-arm")});
    const [px,py]=P([x,y]); ctx.beginPath(); ctx.arc(px,py,4.5*dpr,0,2*Math.PI); ctx.fillStyle=col.pen; ctx.fill();
  }
  ctx.fillStyle=col.trace; ctx.font=`700 ${Math.round(34*dpr)}px ${tok("--mono")}`; ctx.textAlign="center";
  ctx.fillText(String(S.n), w/2, h-28*dpr);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.playing){
    if(S.hold>0){
      S.hold-=dt;
      if(S.hold<=0){S.hold=0;S.t=0;
        if(S.mode==="stages"){S.stage=(S.stage+1)%STAGES.length;S.n=Math.min(STAGES[S.stage],S.terms.length);rebuild();}}
    }else{
      S.t+=dt*S.speed/7;   // دورة كاملة في 7 ثوانٍ بالسرعة 1×
      if(S.t>=1){S.t=1;S.hold=S.mode==="stages"?1.1:0.6;}
    }
  }
  draw(); requestAnimationFrame(frame);
}

/* ---------- الواجهة ---------- */

function shapeIcon(c){return icon("shape",c);}
function buildShapes(){
  const keys=Object.keys(SHAPES).concat(S.custom?["upload"]:[]);
  $("shapes").innerHTML=keys.map(k=>`<button class="btn" data-k="${k}" aria-pressed="${k===S.key}">${shapeIcon(SHAPE_ICONS[k])}${t("shape."+k)}</button>`).join("");
  $("shapes").querySelectorAll("button").forEach(b=>b.onclick=()=>selectShape(b.dataset.k));
}
function selectShape(k){S.key=k; buildShapes(); loadPoints(k==="upload"?S.custom:SHAPES[k]);}

function setPlay(p){
  S.playing=p;
  $("play").innerHTML=p
    ? `${icon("pause")}${t("playback.pause")}`
    : `${icon("play")}${t("playback.play")}`;
}
function setMode(m){
  S.mode=m; $("modeStages").setAttribute("aria-pressed",m==="stages"); $("modeManual").setAttribute("aria-pressed",m==="manual");
  if(m==="stages"){restart();} else {S.t=0;S.hold=0;rebuild();}
}

$("chips").innerHTML=STAGES.map((n,i)=>`<button class="chip" data-n="${n}" data-i="${i}">${n}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  if(S.mode!=="stages"){S.mode="stages";$("modeStages").setAttribute("aria-pressed",true);$("modeManual").setAttribute("aria-pressed",false);}
  S.stage=+c.dataset.i; S.n=Math.min(+c.dataset.n,S.terms.length); S.t=0; S.hold=0; rebuild();
});
$("play").onclick=()=>setPlay(!S.playing);
$("restart").onclick=()=>{restart();setPlay(true);};
$("modeStages").onclick=()=>setMode("stages");
$("modeManual").onclick=()=>setMode("manual");
$("n").oninput=e=>{ if(S.mode!=="manual"){S.mode="manual";$("modeStages").setAttribute("aria-pressed",false);$("modeManual").setAttribute("aria-pressed",true);}
  S.n=+e.target.value; rebuild(); };
$("speed").oninput=e=>{S.speed=+e.target.value;$("speedOut").textContent=S.speed+"×";};
// تغيير عدد النقاط لا يعيد المراحل: يبقى عدد الدوائر والمرحلة والزمن كما هي، فيتغيّر المتغيّران معًا
/** يبدّل تبويب الجدول دون أن يعدّ ذلك خطوة جديدة في المقارنة. */
function setTab(tb){
  S.tab=tb; $("tabC").setAttribute("aria-pressed",tb==="c"); $("tabA").setAttribute("aria-pressed",tb==="a");
  renderTables(true);
}
$("fitBtn").onclick=fitStage;
$("fullBtn").onclick=fullStage;
$("tabC").onclick=()=>setTab("c");
$("tabA").onclick=()=>setTab("a");
$("copyTbl").onclick=copyTable;
$("pts").oninput=e=>{S.P=+e.target.value; sample(); rebuild();};
$("uploadBtn").onclick=()=>$("file").click();
$("file").onchange=e=>loadImageFile(e.target.files[0]);
const drop=$("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>loadImageFile(e.dataTransfer.files[0]));
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();setPlay(!S.playing);}});

applyIcons(); applyStrings(); setPlay(true); selectShape("violin"); requestAnimationFrame(frame);
</script>
